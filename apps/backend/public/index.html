<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FluxLibre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root {
    --bg:#0b0d11; --panel:#151920; --panel-2:#1b2028; --line:#2b323d;
    --text:#edf0f5; --muted:#98a2b3; --accent:#5ee9b5; --accent-dim:#2f8f6d;
    --danger:#ff7a7a; --warn:#ffc46b; --info:#7aa7ff;
    --radius:14px; --radius-sm:9px; --shadow:0 8px 24px rgba(0,0,0,.28);
  }
  * { box-sizing:border-box }
  body { margin:0; background:radial-gradient(1200px 600px at 80% -10%,#16202b 0%,var(--bg) 55%); color:var(--text); font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }

  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:18px 28px; background:rgba(11,13,17,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--line) }
  h1 { margin:0; font-size:21px; font-weight:800; letter-spacing:.4px }
  h1 span { color:var(--accent) }
  .status-pill { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; background:var(--panel); border:1px solid var(--line); border-radius:99px; font-size:12px; color:var(--muted) }
  .status-pill .dot { width:8px; height:8px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 3px rgba(255,122,122,.12) }
  .status-pill .dot.on { background:var(--accent); box-shadow:0 0 0 3px rgba(94,233,181,.14) }

  main { max-width:1180px; margin:0 auto; padding:28px }
  section { background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:22px; box-shadow:var(--shadow) }
  .panel-leboncoin { border-left:3px solid #ff9d4d }
  .panel-vinted { border-left:3px solid #5ee9d0 }

  /* Onglets horizontaux (plateforme) + sous-onglets (section) */
  .top-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:0 }
  .top-tabs button { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border:1px solid var(--line); border-radius:10px 10px 0 0; background:var(--panel); color:var(--muted); font-size:14px; font-weight:800 }
  .top-tabs button.active { color:var(--text); border-bottom-color:transparent; background:var(--panel-2) }
  .top-tabs button[data-platform="leboncoin"].active { color:#ff9d4d; border-color:rgba(255,157,77,.5); border-bottom-color:transparent }
  .top-tabs button[data-platform="vinted"].active { color:#5ee9d0; border-color:rgba(94,233,208,.5); border-bottom-color:transparent }
  .sub-tabs { display:flex; gap:6px; padding:10px 12px 0; background:var(--panel-2); border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px }
  .sub-tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:8px 14px; border-radius:0; font-weight:700 }
  .sub-tabs button.active { color:var(--accent); border-bottom-color:var(--accent) }
  .tab-content { display:none }
  .tab-content.active { display:block }
  .status-tabs { display:flex; gap:6px; margin-bottom:12px; padding:4px; background:#0e1116; border:1px solid var(--line); border-radius:var(--radius-sm) }
  .status-tabs button { background:none; border:0; color:var(--muted); padding:6px 12px; border-radius:6px; font-size:12px; font-weight:700 }
  .status-tabs button.active { background:var(--panel-2); color:var(--text) }
  h2 { margin:0 0 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:1.6px; display:flex; align-items:center; gap:8px }
  h2::before { content:""; width:4px; height:14px; border-radius:4px; background:var(--accent) }

  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px }
  input, textarea, select { width:100%; background:#0e1116; color:var(--text); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; font:inherit; margin-bottom:12px; transition:border-color .15s,box-shadow .15s }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent-dim); box-shadow:0 0 0 3px rgba(94,233,181,.12) }
  textarea { min-height:90px; resize:vertical }
  select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px }

  button { background:linear-gradient(180deg,var(--accent) 0%,#3fc994 100%); color:#06281d; border:0; border-radius:var(--radius-sm); padding:10px 15px; font-weight:800; font-size:13px; cursor:pointer; margin-right:7px; transition:transform .12s,filter .15s,box-shadow .15s; box-shadow:0 3px 10px rgba(94,233,181,.16) }
  button:hover { filter:brightness(1.08); transform:translateY(-1px) }
  button:active { transform:translateY(0) }
  button.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--line); box-shadow:none }
  button.secondary:hover { background:#252c36 }
  button.danger { background:linear-gradient(180deg,#ff8a8a 0%,#e85d5d 100%); color:#2b0808; box-shadow:0 3px 10px rgba(255,122,122,.14) }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; filter:none }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px }

  table { width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px }
  thead th { position:sticky; top:0; background:var(--panel); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; text-align:left; padding:11px 10px; border-bottom:1px solid var(--line) }
  tbody td { padding:12px 10px; border-bottom:1px solid rgba(43,50,61,.6); vertical-align:middle }
  tbody tr { transition:background .12s }
  tbody tr:hover { background:rgba(255,255,255,.025) }
  tbody tr.row-selected { background:rgba(94,233,181,.07) }
  .thumb { width:54px; height:54px; object-fit:cover; border-radius:8px; margin-right:10px; vertical-align:middle; background:var(--panel-2); border:1px solid var(--line) }
  .thumbs { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px }
  .thumbs img { width:40px; height:40px; object-fit:cover; border-radius:6px; cursor:zoom-in; border:1px solid var(--line); transition:transform .12s,border-color .12s }
  .thumbs img:hover { transform:scale(1.08); border-color:var(--accent) }

  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:50; cursor:zoom-out; padding:40px }
  #lightbox img { max-width:94vw; max-height:92vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.6) }

  .tag { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); font-size:10px; font-weight:700; margin:2px; white-space:nowrap }
  .tag.ok { color:var(--accent); border-color:rgba(94,233,181,.35); background:rgba(94,233,181,.08) }
  .tag.bad { color:var(--danger); border-color:rgba(255,122,122,.3); background:rgba(255,122,122,.07) }
  .tag.warn { color:var(--warn); border-color:rgba(255,196,107,.3); background:rgba(255,196,107,.07) }
  .tag i { font-size:11px }
  .refresh-date { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; margin-top:5px }
  .refresh-date.fresh { color:var(--accent); background:rgba(94,233,181,.1) }
  .refresh-date.mid { color:var(--warn); background:rgba(255,196,107,.1) }
  .refresh-date.old { color:var(--danger); background:rgba(255,122,122,.1) }
  .refresh-date.none { color:var(--muted); background:var(--panel-2) }
  .pf-badge { display:inline-flex; flex-direction:column; align-items:center; gap:2px; padding:5px 9px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line); margin:2px; min-width:64px }
  .pf-badge i { font-size:14px }
  .pf-badge span { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px }
  .pf-badge.ok { color:var(--accent); border-color:rgba(94,233,181,.3) }
  .pf-badge.ok span { color:var(--accent) }
  .pf-badge.bad { color:var(--warn); border-color:rgba(255,196,107,.3) }
  .pf-badge.bad span { color:var(--warn) }
  .pf-badge.leboncoin { color:#ff9d4d; border-color:rgba(255,157,77,.45); background:rgba(255,157,77,.08) }
  .pf-badge.leboncoin span { color:#ff9d4d }
  .pf-badge.vinted { color:#5ee9d0; border-color:rgba(94,233,208,.45); background:rgba(94,233,208,.08) }
  .pf-badge.vinted span { color:#5ee9d0 }
  .tabs button[data-tab="leboncoin"] { color:#ff9d4d }
  .tabs button[data-tab="vinted"] { color:#5ee9d0 }
  .actions-cell { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center }
  .icon-btn { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:58px; padding:7px 8px; font-size:9px; font-weight:700; letter-spacing:.3px }
  .icon-btn i { font-size:15px }
  td.center, th.center { text-align:center }

  .tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line) }
  .tabs button { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; padding:9px 14px; font-weight:700; cursor:pointer; margin:0; box-shadow:none }
  .tabs button:hover { background:none; color:var(--text); transform:none }
  .tabs button.active { color:var(--accent); border-bottom-color:var(--accent) }

  .bulk-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; padding:12px 14px; background:#0e1116; border:1px solid var(--line); border-radius:var(--radius-sm) }
  .bulk-bar .inline { display:flex; align-items:center; gap:7px; margin:0; font-size:13px; color:var(--text) }
  .bulk-bar input[type="checkbox"] { width:auto; margin:0 }
  .bulk-bar select, .bulk-bar input[type="number"] { width:auto; margin:0; padding:8px 10px }
  .bulk-bar input[type="number"] { width:72px }
  .bulk-bar button { margin-left:auto }
  input[type="checkbox"].row-check { width:17px; height:17px; margin:0; cursor:pointer; accent-color:var(--accent) }

  #toast { position:fixed; bottom:26px; right:26px; background:var(--panel-2); border:1px solid var(--line); box-shadow:var(--shadow); padding:13px 18px; border-radius:var(--radius-sm); display:none; z-index:60; font-size:13px; font-weight:600 }
  .muted { color:var(--muted); font-size:12.5px }

  @media (max-width:720px) {
    header, main { padding-left:16px; padding-right:16px }
    section { padding:16px }
    .bulk-bar button { margin-left:0 }
    table { font-size:12px }
  }
</style>
</head>
<body>
<header>
  <h1>Flux<span>Libre</span></h1>
  <div class="muted" id="status">Connexion…</div>
</header>
<main>
  <div class="top-tabs" id="top-tabs">
    <button data-platform="leboncoin" class="active"><i class="fa-solid fa-bullhorn"></i> Leboncoin</button>
    <button data-platform="vinted"><i class="fa-brands fa-vinted"></i> Vinted</button>
  </div>
  <div class="sub-tabs" id="sub-tabs">
    <button data-section="annonces" class="active"><i class="fa-solid fa-list"></i> Annonces</button>
    <button data-section="creation"><i class="fa-solid fa-plus"></i> Nouvelle annonce</button>
    <button data-section="jobs"><i class="fa-solid fa-clock-rotate-left"></i> File d'attente</button>
    <button data-section="config"><i class="fa-solid fa-gear"></i> Configuration</button>
  </div>

  <div class="tab-content active" data-content="leboncoin" data-sub="annonces">
  <section class="panel-leboncoin">
    <h2 style="color:#ff9d4d"><i class="fa-solid fa-bullhorn"></i> Annonces Leboncoin</h2>
    <button id="btn-sync-lbc"><i class="fa-solid fa-sync"></i> Synchroniser Leboncoin</button>
    <button class="secondary" id="btn-enrich-lbc"><i class="fa-solid fa-images"></i> Récupérer les photos</button>
    <button class="secondary" id="btn-import-lbc"><i class="fa-solid fa-file-import"></i> Importer la synchro</button>
    <div class="bulk-bar">
      <label class="inline"><input type="checkbox" class="select-all" data-platform="leboncoin" /> Tout sélectionner</label>
      <select class="renew-mode" data-platform="leboncoin" title="Mode de renouvellement">
        <option value="manual">Manuel (je valide)</option>
        <option value="auto">Auto (dépose sans booster)</option>
      </select>
      <input type="number" class="renew-delay" data-platform="leboncoin" value="20" min="5" max="300" title="Délai entre deux annonces" />
      <span class="muted">s entre chaque</span>
      <button class="btn-renew-selection" data-platform="leboncoin">Renouveler la sélection</button>
    </div>
    <div class="status-tabs" data-platform="leboncoin">
      <button data-status="published" class="active">En ligne</button>
      <button data-status="paused">En pause</button>
      <button data-status="all">Toutes</button>
    </div>
    <table><thead><tr><th></th><th>Titre</th><th>Prix</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody id="rows-leboncoin"></tbody></table>
    <p class="muted" id="empty-leboncoin">Aucune annonce Leboncoin.</p>
  </section>
  </div>

  <div class="tab-content" data-content="vinted" data-sub="annonces">
  <section class="panel-vinted">
    <h2 style="color:#5ee9d0"><i class="fa-brands fa-vinted"></i> Annonces Vinted</h2>
    <button id="btn-sync-vinted" style="background:linear-gradient(180deg,#5ee9d0 0%,#2fbfa8 100%)"><i class="fa-solid fa-sync"></i> Synchroniser Vinted</button>
    <button class="secondary" id="btn-import-vinted"><i class="fa-solid fa-file-import"></i> Importer la synchro</button>
    <div class="bulk-bar">
      <label class="inline"><input type="checkbox" class="select-all" data-platform="vinted" /> Tout sélectionner</label>
      <select class="renew-mode" data-platform="vinted" title="Mode de renouvellement">
        <option value="manual">Manuel (je valide)</option>
        <option value="auto">Auto</option>
      </select>
      <input type="number" class="renew-delay" data-platform="vinted" value="20" min="5" max="300" title="Délai entre deux annonces" />
      <span class="muted">s entre chaque</span>
      <button class="btn-renew-selection" data-platform="vinted" style="background:linear-gradient(180deg,#5ee9d0 0%,#2fbfa8 100%)">Renouveler la sélection</button>
    </div>
    <div class="status-tabs" data-platform="vinted">
      <button data-status="published" class="active">En ligne</button>
      <button data-status="paused">En pause</button>
      <button data-status="all">Toutes</button>
    </div>
    <table><thead><tr><th></th><th>Titre</th><th>Prix</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody id="rows-vinted"></tbody></table>
    <p class="muted" id="empty-vinted">Aucune annonce Vinted.</p>
  </section>
  </div>

  <div class="tab-content" data-sub="creation">
  <section>
    <h2>Nouvelle annonce</h2>
    <div class="grid">
      <div><label>Titre</label><input id="f-title" placeholder="Veste en jean Levi's taille M" /></div>
      <div><label>Prix (€)</label><input id="f-price" type="number" step="0.01" min="0" /></div>
      <div><label>Catégorie</label><input id="f-category" placeholder="Mode / Vêtements" /></div>
      <div><label>Livraison</label><select id="f-delivery"><option value="false">Non</option><option value="true">Oui</option></select></div>
    </div>
    <label>Description</label>
    <textarea id="f-description" placeholder="État, mesures, matière…"></textarea>
    <label>Photos (URLs ou chemins locaux, un par ligne)</label>
    <textarea id="f-images" style="min-height:60px" placeholder="C:\photos\veste.jpg"></textarea>
    <select id="ai-platform" title="Plateforme pour l'IA">
      <option value="leboncoin">IA pour Leboncoin</option>
      <option value="vinted">IA pour Vinted</option>
    </select>
    <button id="btn-generate">Générer avec l'IA</button>
    <button id="btn-create">Créer l'annonce</button>
  </section>
  </div>

  <div class="tab-content" data-sub="jobs">
  <section>
    <h2>File d'attente</h2>
    <button id="btn-jobs">Rafraîchir</button>
    <button class="secondary" id="btn-purge">Purger terminées / échouées</button>
    <button class="secondary" id="btn-purge-all">Tout purger</button>
    <button class="secondary" id="btn-maintenance">Maintenance / renouvellements</button>
    <table><thead><tr><th>Type</th><th>Plateforme</th><th>Statut</th><th>Créée</th><th>Erreur</th></tr></thead>
    <tbody id="job-rows"></tbody></table>
  </section>
  </div>

  <div class="tab-content" data-sub="config">
  <section>
    <h2>Configuration</h2>
    <div class="grid">
      <div><label>Fournisseur IA</label><select id="c-provider"><option value="none">Aucun</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="ollama">Ollama</option></select></div>
      <div><label>Modèle</label><input id="c-model" /></div>
      <div><label>URL de base (optionnel)</label><input id="c-baseurl" /></div>
      <div><label>Clé API (stockée localement)</label><input id="c-key" type="password" /></div>
      <div><label>Renouvellement après (jours)</label><input id="c-renew" type="number" min="1" /></div>
      <div><label>Publication automatique</label><select id="c-autosubmit"><option value="false">Non (validation manuelle)</option><option value="true">Oui</option></select></div>
    </div>
    <button id="btn-config">Enregistrer</button>
  </section>
  </div>
</main>
<div id="lightbox"><img id="lightbox-img" alt="Aperçu" /></div>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const API = '/api';
let state = { listings: [], publications: [], jobs: [] };

async function api(path, options = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  if (res.status === 204) return null;
  return res.json();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 3500); }
function tag(text, cls = '') { return `<span class="tag ${cls}">${text}</span>`; }

async function refresh() {
  try {
    const [data, jobs] = await Promise.all([api('/listings'), api('/jobs')]);
    state = { ...data, jobs: jobs.jobs };
    render();
    $('status').textContent = 'Backend connecté';
  } catch (e) { $('status').textContent = 'Erreur: ' + e.message; }
}

let activePlatform = 'leboncoin';
let activeSection = 'annonces';

function updateTabs() {
  document.querySelectorAll('#top-tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.platform === activePlatform));
  document.querySelectorAll('#sub-tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.section === activeSection));
  document.querySelectorAll('.tab-content').forEach(c => {
    const platformOk = !c.dataset.content || c.dataset.content === activePlatform;
    const sectionOk = c.dataset.sub === activeSection;
    c.classList.toggle('active', platformOk && sectionOk);
  });
}
document.getElementById('top-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-platform]');
  if (!b) return;
  activePlatform = b.dataset.platform;
  updateTabs();
});
document.getElementById('sub-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-section]');
  if (!b) return;
  activeSection = b.dataset.section;
  updateTabs();
});

const selectedByPlatform = { leboncoin: new Set(), vinted: new Set() };
const statusFilter = { leboncoin: 'published', vinted: 'published' };

document.querySelectorAll('.status-tabs').forEach(bar => {
  bar.addEventListener('click', e => {
    const b = e.target.closest('button[data-status]');
    if (!b) return;
    statusFilter[bar.dataset.platform] = b.dataset.status;
    bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
});

function render() {
  for (const platform of ['leboncoin', 'vinted']) {
    const rows = $(`rows-${platform}`);
    const empty = $(`empty-${platform}`);
    const listings = state.listings.filter(l => {
      if (!state.publications.some(p => p.listingId === l.id && p.platform === platform)) return false;
      const f = statusFilter[platform];
      if (f === 'paused') return l.status === 'paused';
      if (f === 'published') return l.status !== 'paused';
      return true;
    });
    const selected = selectedByPlatform[platform];
    rows.innerHTML = listings.map(l => {
      const pub = state.publications.find(p => p.listingId === l.id && p.platform === platform);
      const ok = pub?.status === 'published';
      return `<tr class="${selected.has(l.id) ? 'row-selected' : ''}">
        <td><input type="checkbox" class="row-check" data-id="${l.id}" data-platform="${platform}" ${selected.has(l.id) ? 'checked' : ''} /></td>
        <td>${escapeHtml(l.title)}<div class="muted">${l.category || ''}${l.delivery ? ' · Livraison' : ''} · ${l.images.length} photo(s)</div>
          ${refreshBadge(l)}
          ${l.images.length ? `<div class="thumbs">${l.images.map(src => `<img src="${escapeHtml(src)}" loading="lazy" onerror="this.style.display='none'" data-zoom="${escapeHtml(src)}" />`).join('')}</div>` : ''}</td>
        <td>${l.price ? `${l.price.toFixed(2)} €` : '—'}</td>
        <td>${tag(l.status, l.status === 'published' ? 'ok' : l.status === 'paused' ? 'bad' : '')}</td>
        <td><div class="actions-cell">
          <button class="secondary icon-btn" data-act="publish" data-id="${l.id}" data-platform="${platform}" title="Publier sur ${platform}"><i class="fa-solid fa-upload"></i>Publier</button>
          ${l.status !== 'paused' ? `<button class="secondary icon-btn" data-act="pause" data-id="${l.id}" data-platform="${platform}" title="Mettre en pause"><i class="fa-solid fa-pause"></i>Pause</button>` : ''}
          <button class="secondary icon-btn" data-act="renew" data-id="${l.id}" data-platform="${platform}" title="Renouveler sur ${platform}"><i class="fa-solid fa-rotate"></i>Renouveler</button>
          <button class="secondary icon-btn" data-act="refresh" data-id="${l.id}" data-platform="${platform}" title="Mettre à jour depuis ${platform}"><i class="fa-solid fa-arrows-rotate"></i>MàJ</button>
          <button class="danger icon-btn" data-act="delete" data-id="${l.id}" data-platform="${platform}" title="Supprimer de ${platform}"><i class="fa-solid fa-trash"></i>Supprimer</button>
        </div></td></tr>`;
    }).join('');
    empty.style.display = listings.length ? 'none' : 'block';
    empty.textContent = `Aucune annonce ${platform === 'leboncoin' ? 'Leboncoin' : 'Vinted'}.`;
  }
  $('job-rows').innerHTML = state.jobs.map(j => `<tr>
      <td>${j.type}</td><td>${j.platform}</td><td>${tag(j.status, j.status === 'done' ? 'ok' : j.status === 'failed' ? 'bad' : '')}</td>
      <td class="muted">${new Date(j.createdAt).toLocaleString('fr-FR')}</td><td class="muted">${escapeHtml(j.error || '')}</td></tr>`).join('');
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function refreshBadge(l) {
  if (!l.lastRefreshedAt) return '<span class="refresh-date none" title="Jamais rafraîchi"><i class="fa-regular fa-clock"></i> jamais</span>';
  const days = Math.floor((Date.now() - new Date(l.lastRefreshedAt).getTime()) / 86400000);
  const cls = days <= 4 ? 'fresh' : days <= 7 ? 'mid' : 'old';
  const label = days === 0 ? "aujourd'hui" : days === 1 ? 'hier' : `${days} j`;
  return `<span class="refresh-date ${cls}" title="Dernier refresh : ${new Date(l.lastRefreshedAt).toLocaleString('fr-FR')}"><i class="fa-solid fa-rotate"></i> ${label}</span>`;
}

$('btn-create').onclick = async () => {
  try {
    await api('/listings', { method: 'POST', body: JSON.stringify({
      title: $('f-title').value, description: $('f-description').value, price: Number($('f-price').value || 0),
      category: $('f-category').value, delivery: $('f-delivery').value === 'true',
      images: $('f-images').value.split('\n').map(s => s.trim()).filter(Boolean),
    })});
    ['f-title','f-description','f-price','f-category','f-images'].forEach(id => $(id).value = '');
    toast('Annonce créée'); await refresh();
  } catch (e) { toast(e.message); }
};

$('btn-generate').onclick = async () => {
  try {
    const platform = $('ai-platform').value;
    const r = await api('/ai/generate', { method: 'POST', body: JSON.stringify({
      title: $('f-title').value, description: $('f-description').value, category: $('f-category').value, platform,
    })});
    $('f-title').value = r.title;
    $('f-description').value = r.description;
    toast(`Description générée pour ${platform}`);
  } catch (e) { toast(e.message); }
};

document.addEventListener('change', (e) => {
  const check = e.target.closest('input.row-check');
  if (check) {
    const set = selectedByPlatform[check.dataset.platform];
    if (check.checked) set.add(check.dataset.id);
    else set.delete(check.dataset.id);
    check.closest('tr').classList.toggle('row-selected', check.checked);
    return;
  }
  if (e.target.matches('input.select-all')) {
    const platform = e.target.dataset.platform;
    const listings = state.listings.filter(l =>
      state.publications.some(p => p.listingId === l.id && p.platform === platform),
    );
    listings.forEach(l => e.target.checked ? selectedByPlatform[platform].add(l.id) : selectedByPlatform[platform].delete(l.id));
    render();
  }
});

document.querySelectorAll('button.btn-renew-selection').forEach(btn => {
  btn.onclick = async () => {
    const platform = btn.dataset.platform;
    const ids = [...selectedByPlatform[platform]];
    if (!ids.length) { toast(`Sélectionne au moins une annonce ${platform}`); return; }
    try {
      const mode = document.querySelector(`select.renew-mode[data-platform="${platform}"]`).value;
      const delay = Number(document.querySelector(`input.renew-delay[data-platform="${platform}"]`).value || 20);
      const r = await api('/renew', { method: 'POST', body: JSON.stringify({
        listingIds: ids, platforms: [platform], autoSubmit: mode === 'auto', delaySeconds: delay,
      }) });
      const count = r.jobs.filter(j => j.type === 'publish').length;
      toast(`${count} annonce(s) ${platform} en renouvellement${count > 1 ? ` — ${delay}s entre chacune` : ''}`);
      selectedByPlatform[platform].clear();
      await refresh();
    } catch (e) { toast(e.message); }
  };
});

document.body.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, id, platform } = btn.dataset;
  const p = platform || 'leboncoin';
  try {
    if (act === 'publish') await api('/publish', { method: 'POST', body: JSON.stringify({ listingId: id, platforms: [p] }) });
    if (act === 'renew') await api('/renew', { method: 'POST', body: JSON.stringify({ listingId: id, platforms: [p] }) });
    if (act === 'refresh') await api('/refresh', { method: 'POST', body: JSON.stringify({ listingId: id, platform: p }) });
    if (act === 'pause') await api('/pause', { method: 'POST', body: JSON.stringify({ listingId: id, platforms: [p] }) });
    if (act === 'delete') await api('/delete', { method: 'POST', body: JSON.stringify({ listingId: id, platforms: [p] }) });
    toast(`Tâche ${p} en file d’attente`); await refresh();
  } catch (err) { toast(err.message); }
});

for (const platform of ['leboncoin', 'vinted']) {
  const suffix = platform === 'leboncoin' ? 'lbc' : 'vinted';
  $(`btn-sync-${suffix}`).onclick = async () => {
    try {
      await api('/sync', { method: 'POST', body: JSON.stringify({ platforms: [platform] }) });
      toast(`Synchro ${platform} lancée`);
      await refresh();
    } catch (e) { toast(e.message); }
  };
  $(`btn-import-${suffix}`).onclick = async () => {
    try {
      const r = await api('/sync/import', { method: 'POST', body: JSON.stringify({ platform }) });
      toast(`${r.imported} annonce(s) ${platform} importée(s)`);
      await refresh();
    } catch (e) { toast(e.message); }
  };
}
$('btn-enrich-lbc').onclick = async () => {
  try { const r = await api('/enrich', { method: 'POST', body: JSON.stringify({ platform: 'leboncoin' }) }); toast(`${r.jobs.length} annonce(s) en file`); await refresh(); }
  catch (e) { toast(e.message); }
};
$('lightbox').onclick = () => { $('lightbox').style.display = 'none'; };
document.addEventListener('click', (e) => {
  const img = e.target.closest('img[data-zoom]');
  if (!img) return;
  $('lightbox-img').src = img.dataset.zoom;
  $('lightbox').style.display = 'flex';
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').style.display = 'none'; });

$('btn-jobs').onclick = refresh;
$('btn-purge').onclick = async () => {
  try { const r = await api('/jobs?status=done,failed', { method: 'DELETE' }); toast(`${r.deleted} tâche(s) purgée(s)`); await refresh(); }
  catch (e) { toast(e.message); }
};
$('btn-purge-all').onclick = async () => {
  try { const r = await api('/jobs?status=all', { method: 'DELETE' }); toast(`${r.deleted} tâche(s) purgée(s)`); await refresh(); }
  catch (e) { toast(e.message); }
};
$('btn-maintenance').onclick = async () => { try { console.log(await api('/maintenance', { method: 'POST' })); await refresh(); } catch (e) { toast(e.message); } };

$('btn-config').onclick = async () => {
  try {
    await api('/config', { method: 'PATCH', body: JSON.stringify({
      aiProvider: $('c-provider').value, aiModel: $('c-model').value, aiBaseUrl: $('c-baseurl').value,
      aiApiKey: $('c-key').value || undefined,
      renewAfterDays: Number($('c-renew').value || 30), autoSubmit: $('c-autosubmit').value === 'true',
    })});
    $('c-key').value = ''; toast('Configuration enregistrée');
  } catch (e) { toast(e.message); }
};

(async () => {
  try {
    const c = await api('/config');
    $('c-provider').value = c.aiProvider; $('c-model').value = c.aiModel; $('c-baseurl').value = c.aiBaseUrl;
    $('c-renew').value = c.renewAfterDays; $('c-autosubmit').value = String(c.autoSubmit);
  } catch {}
  updateTabs();
  await refresh();
  setInterval(refresh, 20000);
})();
</script>
