<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FluxLibre — Options</title>
<style>
  body { max-width:560px; margin:40px auto; font:15px/1.5 system-ui,sans-serif; color:#e8eaf0; background:#14171c; padding:0 20px }
  h1 { font-size:22px } h1 span { color:#6ee7b7 }
  label { display:block; font-size:13px; color:#9aa3b2; margin-bottom:4px }
  input, select { width:100%; background:#111318; color:#e8eaf0; border:1px solid #2a2f38; border-radius:8px; padding:9px; margin-bottom:14px; font:inherit }
  button { background:#6ee7b7; color:#06281d; border:0; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer }
  #msg { color:#6ee7b7; margin-left:10px }
  .note { color:#9aa3b2; font-size:13px; border-left:3px solid #6ee7b7; padding-left:10px }
</style>
</head>
<body>
  <h1>Flux<span>Libre</span> — Options</h1>
  <label>URL du backend local</label>
  <input id="backendUrl" placeholder="http://localhost:7310" />
  <label>Publication automatique (décocher pour valider chaque annonce à la main)</label>
  <select id="autoSubmit"><option value="false">Non — validation manuelle</option><option value="true">Oui — publier directement</option></select>
  <button id="save">Enregistrer</button><span id="msg"></span>
  <p class="note">L'extension exécute les tâches créées dans le dashboard. Elle ne remplit les formulaires que sur les pages officielles de Leboncoin et Vinted. Vérifiez toujours les champs avant de publier.</p>
  <script type="module" src="/src/options/options.ts"></script>
</body>
</html>
